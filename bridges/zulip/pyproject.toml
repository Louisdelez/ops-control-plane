[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
authors = [{ name = "LOUIS DELEZ" }]
name = "zulip-approval-bridge"
version = "0.3.0"
description = "Fail-closed Zulip mobile Ops, approval, alert and report bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
zulip-approval-bridge = "zulip_approval_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
