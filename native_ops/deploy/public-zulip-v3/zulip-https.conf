server {
    listen 127.0.0.1:8546 ssl proxy_protocol;
    server_name zulip.example.org;
    ssl_certificate /etc/letsencrypt/live/ops-zulip-delez-ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops-zulip-delez-ovh/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    location / {
        proxy_pass https://198.51.100.2:18443;
        proxy_ssl_server_name on;
        proxy_ssl_name zulip.ops.local;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/ops-zulip-upstream-ca.crt;
        proxy_set_header Host zulip.example.org;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1200s;
    }
}
