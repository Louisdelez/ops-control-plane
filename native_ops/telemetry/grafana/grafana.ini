[paths]
data = /var/lib/ops-grafana
logs = /var/log/ops-grafana
plugins = /var/lib/ops-grafana/plugins
provisioning = /etc/ops-grafana/provisioning
[server]
http_addr = 127.0.0.1
http_port = 3100
root_url = http://127.0.0.1:3100/
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[security]
disable_initial_admin_creation = true
cookie_samesite = strict
[auth]
disable_login_form = true
[auth.basic]
enabled = false
[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
[users]
default_language = fr-FR
allow_sign_up = false
[news]
news_feed_enabled = false
[plugins]
disable_plugins = graphite,dashboard,grafana-azure-monitor-datasource,mixed,cloudwatch,grafana-testdata-datasource,alertmanager
preinstall_disabled = true
