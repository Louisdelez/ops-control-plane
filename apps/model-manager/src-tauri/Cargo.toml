[package]
license = "MIT"
name = "ops-model-manager"
version = "0.1.0"
description = "Gestionnaire local et supervise du catalogue de modeles IA"
authors = ["LOUIS DELEZ"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "ops_model_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
native-desktop = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6.5"
rustix = { version = "1.1.4", features = ["event", "fs", "process"] }
tauri = { version = "2", features = [] }
zeroize = "1.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# RUSTSEC-2024-0429: upstream two-line fix backported for GTK3 compatibility.
[patch.crates-io]
glib = { path = "../../ops-desktop/vendor/glib-0.18.5" }
