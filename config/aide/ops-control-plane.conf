# Keep Fedora's packaged policy as the source of truth.  These final negative
# rules are guardrails for data that must never enter the local integrity DB.
@@include /etc/aide.conf

# Human workspaces are intentionally outside the system integrity baseline.
!/home/ops-user

# Volatile filesystems and common runtime-secret locations.
!/run
!/var/run
!/tmp
!/var/tmp
!/dev/shm

# systemd rewrites these root-owned resource-control drop-ins atomically while
# services are started/stopped.  Their inode churn is runtime state, not the
# reviewed static unit configuration under /etc/systemd/system.
!/etc/systemd/system\.control

# Stateful control-plane data changes during normal operation and can contain
# secrets or sensitive mission context.  Static binaries/configuration under
# /usr, /opt and /etc remain covered by Fedora's policy.
!/var/lib/openbao
# Hermes keeps mutable workspaces and caches under its service home, but its
# root-owned runtime/configuration is part of the trusted computing base.
/var/lib/hermes/hermes-agent NORMAL
/var/lib/hermes/config\.yaml$ NORMAL
/var/lib/hermes/SOUL\.md$ NORMAL
/var/lib/hermes/skills NORMAL
/var/lib/hermes/profiles/[^/]+/config\.yaml$ NORMAL
/var/lib/hermes/profiles/[^/]+/SOUL\.md$ NORMAL
/var/lib/hermes/profiles/[^/]+/skills NORMAL
!/var/lib/ollama
!/var/lib/ops-broker
!/var/lib/zulip-approval-bridge
!/var/lib/prometheus
!/var/lib/alertmanager
!/var/lib/node-exporter
!/var/lib/ops-reports
