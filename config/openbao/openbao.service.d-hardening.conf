[Unit]
# Pull the TPM-backed unseal companion in on boot and on every manual service
# restart.  Its reciprocal After=openbao.service prevents an ordering cycle.
Wants=openbao-unseal.service

[Service]
UMask=0077
LimitCORE=0
MemorySwapMax=0

ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
NoNewPrivileges=yes

ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid

RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
LockPersonality=yes
SystemCallArchitectures=native
MemoryDenyWriteExecute=yes

StateDirectory=openbao
StateDirectoryMode=0700
LogsDirectory=openbao
LogsDirectoryMode=0700
ReadWritePaths=/var/lib/openbao /var/log/openbao

LoadCredentialEncrypted=tls.key:/etc/credstore.encrypted/openbao-tls.key
