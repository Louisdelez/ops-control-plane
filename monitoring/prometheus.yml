global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: dell-ops
    environment: operations

alerting:
  alertmanagers:
    - static_configs:
        - targets: [127.0.0.1:9093]

rule_files:
  - /etc/prometheus/ops-alerts.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

  - job_name: dell-ops
    static_configs:
      - targets: [127.0.0.1:9100]
        labels:
          owner: infra-shared
