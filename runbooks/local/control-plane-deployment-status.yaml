id: local.control-plane-deployment-status.v1
version: 1
project: infra-shared
action_class: A
description: Lire le statut borne du deploiement local Atlas, orchestrateur, Hermes et Zulip
timeout_seconds: 10
command:
  argv:
    - /usr/bin/sudo
