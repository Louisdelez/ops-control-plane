id: network.publish-zulip.v1
version: 1
project: infra-shared
action_class: C
description: Activer le paquet borné HTTPS zulip.example.org via VPS WireGuard NAS et relais SSH Dell, certificat public et migration locale avec retour arrière
timeout_seconds: 20
command:
  argv: [/usr/bin/sudo, -n, /usr/local/libexec/ops-runbooks/publish-zulip, "{bundle_sha256}"]
parameters:
  bundle_sha256:
    type: enum
    values: [20b73887fb7d3a6c65a847e9a1afe7b1c5ae7cb88206005b143a00ec13c2ea97]
output:
  max_bytes: 4096
  redact: true
