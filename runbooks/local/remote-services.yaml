id: inventory.remote-services.v1
version: 1
project: infra-shared
action_class: A
description: Observer par SSH natif les unités systemd, conteneurs et capacités disque d’une des quatre machines déclarées, sans modification distante
timeout_seconds: 90
command:
  argv:
    - /usr/bin/sudo
    - -n
    - /usr/local/libexec/ops-runbooks/remote-services
    - "{resource}"
parameters:
  resource:
    type: enum
    values: [edge-vps, prod, nas, gamebox]
output:
  max_bytes: 65536
  redact: true
