id: inventory.public-zulip-preflight.v1
version: 1
project: infra-shared
action_class: A
description: Observer adresses, écoute HTTPS et directives publiques proxy pour Zulip sans lecture de clés ni modification
timeout_seconds: 35
command:
  argv: [/usr/bin/sudo, -n, /usr/local/libexec/ops-runbooks/public-zulip-preflight, "{resource}"]
parameters:
  resource:
    type: enum
    values: [edge-vps, nas, prod]
output:
  max_bytes: 16384
  redact: true
