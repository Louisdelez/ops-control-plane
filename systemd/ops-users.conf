g ops-agents -
g ops-readers -

u hermesd - "Hermes coordinator" /var/lib/hermes /usr/sbin/nologin
u opsbroker - "Deterministic Ops broker" /var/lib/ops-broker /usr/sbin/nologin
u zulipbridge - "Zulip Ops bridge" /var/lib/zulip-approval-bridge /usr/sbin/nologin
u ops-monitor - "Monitoring agent" /var/lib/ops-monitor /usr/sbin/nologin
u minecraft-ops - "Minecraft operations agent" /var/lib/minecraft-ops /usr/sbin/nologin
u backup-agent - "Backup agent" /var/lib/backup-agent /usr/sbin/nologin
u deploy-agent - "Deployment agent" /var/lib/deploy-agent /usr/sbin/nologin
u infra-network - "Network shared agent" /var/lib/infra-network /usr/sbin/nologin
u security-audit - "Security audit agent" /var/lib/security-audit /usr/sbin/nologin
u ollama - "Local model inference" /var/lib/ollama /usr/sbin/nologin
u node-exporter - "Prometheus node exporter" /var/lib/node-exporter /usr/sbin/nologin

m hermesd ops-agents
m opsbroker ops-agents
m zulipbridge ops-agents
m ops-monitor ops-agents
m ops-monitor ops-readers
m zulipbridge ops-readers
m minecraft-ops ops-agents
m backup-agent ops-agents
m deploy-agent ops-agents
m infra-network ops-agents
m security-audit ops-agents
m security-audit ops-readers
m ollama video
m ollama render
