[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
authors = [{ name = "LOUIS DELEZ" }]
name = "ops-provider-discovery"
version = "0.1.0"
description = "Bounded, observation-only provider model inventory collector"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
ops-provider-discovery = "ops_provider_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
